services:
  typesafe-chat:
    build: .
    image: home-chat:chatgpt
    container_name: typesafe-chat
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["node", "ha-chat-server.mjs"]
    env_file: runtime.env
    environment:
      CHAT_DATA_DIR: /data
      LLM_PROVIDER: chatgpt
      CHAT_PORT: '5189'
      CHAT_HA_URL: http://127.0.0.1:8123
    volumes:
      - ./app:/app:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
